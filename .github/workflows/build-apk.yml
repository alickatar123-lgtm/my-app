name: Build CuteAI APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CuteAI
        run: |
          unzip -o CuteAI.zip -d cuteai
          ls -la cuteai

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: cuteai
          buildozer_version: master
          command: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CuteAI-APK
          path: cuteai/bin/*.apk
